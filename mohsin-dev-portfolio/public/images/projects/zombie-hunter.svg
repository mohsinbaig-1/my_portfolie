<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Zombie Hunter gameplay preview">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <rect x="0" y="500" width="1200" height="175" fill="#0f172a" opacity="0.8"/>
  <circle cx="200" cy="150" r="80" fill="#22d3ee" opacity="0.08" filter="url(#glow)"/>
  <circle cx="900" cy="200" r="120" fill="#a855f7" opacity="0.06" filter="url(#glow)"/>
  <!-- Silhouette buildings -->
  <rect x="50" y="300" width="80" height="200" fill="#1e293b" opacity="0.7"/>
  <rect x="160" y="250" width="100" height="250" fill="#1e293b" opacity="0.6"/>
  <rect x="900" y="280" width="90" height="220" fill="#1e293b" opacity="0.7"/>
  <rect x="1020" y="320" width="70" height="180" fill="#1e293b" opacity="0.6"/>
  <!-- Player silhouette -->
  <ellipse cx="600" cy="520" rx="30" ry="8" fill="#000" opacity="0.4"/>
  <rect x="585" y="420" width="30" height="100" rx="8" fill="#334155"/>
  <circle cx="600" cy="405" r="18" fill="#475569"/>
  <rect x="615" y="440" width="50" height="8" rx="4" fill="#64748b" transform="rotate(-10 615 440)"/>
  <!-- Enemy silhouettes -->
  <ellipse cx="750" cy="530" rx="25" ry="6" fill="#000" opacity="0.4"/>
  <rect x="738" y="450" width="24" height="80" rx="6" fill="#7f1d1d" opacity="0.8"/>
  <circle cx="750" cy="440" r="14" fill="#991b1b"/>
  <ellipse cx="420" cy="535" rx="25" ry="6" fill="#000" opacity="0.4"/>
  <rect x="408" y="455" width="24" height="80" rx="6" fill="#7f1d1d" opacity="0.8"/>
  <circle cx="420" cy="445" r="14" fill="#991b1b"/>
  <!-- Crosshair -->
  <circle cx="600" cy="350" r="20" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.8"/>
  <line x1="600" y1="325" x2="600" y2="340" stroke="#22d3ee" stroke-width="2"/>
  <line x1="600" y1="360" x2="600" y2="375" stroke="#22d3ee" stroke-width="2"/>
  <line x1="575" y1="350" x2="590" y2="350" stroke="#22d3ee" stroke-width="2"/>
  <line x1="610" y1="350" x2="625" y2="350" stroke="#22d3ee" stroke-width="2"/>
  <!-- HUD elements -->
  <rect x="40" y="40" width="200" height="12" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1" opacity="0.8"/>
  <rect x="40" y="40" width="160" height="12" rx="6" fill="#22d3ee" opacity="0.6"/>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">HP</text>
  <rect x="960" y="40" width="200" height="12" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
  <rect x="960" y="40" width="120" height="12" rx="6" fill="#a855f7" opacity="0.6"/>
  <text x="960" y="70" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">AMMO 12/30</text>
  <!-- Title overlay -->
  <text x="600" y="640" text-anchor="middle" fill="url(#neon)" font-family="system-ui,sans-serif" font-size="28" font-weight="bold" filter="url(#glow)">ZOMBIE HUNTER</text>
  <text x="600" y="665" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="14">UE5 Gameplay Showcase</text>
</svg>
